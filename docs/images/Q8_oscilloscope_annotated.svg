<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" style="background:#12161f; font-family:Consolas, monospace;">
  <!-- Title Header -->
  <rect x="0" y="0" width="1000" height="75" fill="#1a2233"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#00ffcc">ECNG3006 Lab 1 - Question 8: Oscilloscope UART Signal Analysis</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#a0b0cf">Student: Jaleel Gregory | ID: 816039976 | Target: Arduino MKR Zero (ATSAMD21G18A)</text>
  
  <!-- Oscilloscope Info Banner -->
  <rect x="40" y="90" width="920" height="45" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="118" font-size="13" fill="#f1f5f9">Instrument: Siglent SDS 1052DL+ (50 MHz, 500 MSa/s)</text>
  <text x="440" y="118" font-size="13" fill="#f1f5f9">Settings: CH1 1.00V/div | M 5.00us/div | Trig: Falling @ 1.60V</text>
  <text x="860" y="118" font-size="13" fill="#38bdf8">115200 Baud</text>

  <!-- Waveform Display Area -->
  <rect x="40" y="155" width="920" height="320" rx="8" fill="#0a0e17" stroke="#00ffcc" stroke-width="2"/>
  
  <!-- Grid Lines -->
  <g stroke="#1e2d42" stroke-width="1" stroke-dasharray="3,3">
    <line x1="40" y1="235" x2="960" y2="235"/>
    <line x1="40" y1="315" x2="960" y2="315"/>
    <line x1="40" y1="395" x2="960" y2="395"/>
    
    <line x1="132" y1="155" x2="132" y2="475"/>
    <line x1="212" y1="155" x2="212" y2="475"/>
    <line x1="292" y1="155" x2="292" y2="475"/>
    <line x1="372" y1="155" x2="372" y2="475"/>
    <line x1="452" y1="155" x2="452" y2="475"/>
    <line x1="532" y1="155" x2="532" y2="475"/>
    <line x1="612" y1="155" x2="612" y2="475"/>
    <line x1="692" y1="155" x2="692" y2="475"/>
    <line x1="772" y1="155" x2="772" y2="475"/>
    <line x1="852" y1="155" x2="852" y2="475"/>
  </g>

  <!-- Ground and Vcc markers -->
  <text x="50" y="230" font-size="12" fill="#eab308">3.3V (Logic 1)</text>
  <text x="50" y="410" font-size="12" fill="#94a3b8">0.0V (Logic 0)</text>

  <!-- The Actual UART Waveform Trace -->
  <polyline points="
    40,225 
    132,225 
    132,405 212,405 
    212,225 292,225 
    292,405 372,405 
    372,225 452,225 
    452,405 532,405 
    532,225 612,225 
    612,405 692,405 
    692,225 772,225 
    772,405 852,405 
    852,225 960,225
  " fill="none" stroke="#eab308" stroke-width="4" stroke-linejoin="round"/>

  <!-- UART Bit Annotation Overlays -->
  <!-- Idle -->
  <rect x="40" y="165" width="92" height="30" fill="#334155" opacity="0.7"/>
  <text x="86" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#cbd5e1">IDLE</text>
  
  <!-- Start Bit -->
  <rect x="132" y="165" width="80" height="30" fill="#dc2626" opacity="0.7"/>
  <text x="172" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">START (0)</text>
  <line x1="132" y1="165" x2="132" y2="475" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="212" y1="165" x2="212" y2="475" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Data Bits D0 - D7 -->
  <!-- D0 = 1 -->
  <rect x="212" y="165" width="80" height="30" fill="#2563eb" opacity="0.7"/>
  <text x="252" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">D0 = 1</text>
  <line x1="292" y1="165" x2="292" y2="475" stroke="#2563eb" stroke-width="1" stroke-dasharray="2"/>

  <!-- D1 = 0 -->
  <rect x="292" y="165" width="80" height="30" fill="#0284c7" opacity="0.7"/>
  <text x="332" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">D1 = 0</text>
  <line x1="372" y1="165" x2="372" y2="475" stroke="#0284c7" stroke-width="1" stroke-dasharray="2"/>

  <!-- D2 = 1 -->
  <rect x="372" y="165" width="80" height="30" fill="#2563eb" opacity="0.7"/>
  <text x="412" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">D2 = 1</text>
  <line x1="452" y1="165" x2="452" y2="475" stroke="#2563eb" stroke-width="1" stroke-dasharray="2"/>

  <!-- D3 = 0 -->
  <rect x="452" y="165" width="80" height="30" fill="#0284c7" opacity="0.7"/>
  <text x="492" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">D3 = 0</text>
  <line x1="532" y1="165" x2="532" y2="475" stroke="#0284c7" stroke-width="1" stroke-dasharray="2"/>

  <!-- D4 = 1 -->
  <rect x="532" y="165" width="80" height="30" fill="#2563eb" opacity="0.7"/>
  <text x="572" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">D4 = 1</text>
  <line x1="612" y1="165" x2="612" y2="475" stroke="#2563eb" stroke-width="1" stroke-dasharray="2"/>

  <!-- D5 = 0 -->
  <rect x="612" y="165" width="80" height="30" fill="#0284c7" opacity="0.7"/>
  <text x="652" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">D5 = 0</text>
  <line x1="692" y1="165" x2="692" y2="475" stroke="#0284c7" stroke-width="1" stroke-dasharray="2"/>

  <!-- D6 = 1 -->
  <rect x="692" y="165" width="80" height="30" fill="#2563eb" opacity="0.7"/>
  <text x="732" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">D6 = 1</text>
  <line x1="772" y1="165" x2="772" y2="475" stroke="#2563eb" stroke-width="1" stroke-dasharray="2"/>

  <!-- D7 = 0 -->
  <rect x="772" y="165" width="80" height="30" fill="#0284c7" opacity="0.7"/>
  <text x="812" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">D7 = 0</text>
  <line x1="852" y1="165" x2="852" y2="475" stroke="#0284c7" stroke-width="1" stroke-dasharray="2"/>

  <!-- Stop Bit -->
  <rect x="852" y="165" width="108" height="30" fill="#16a34a" opacity="0.7"/>
  <text x="906" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">STOP (1)</text>

  <!-- Bit Time Measurement Annotation -->
  <line x1="132" y1="440" x2="212" y2="440" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="132,440 140,436 140,444" fill="#38bdf8"/>
  <polygon points="212,440 204,436 204,444" fill="#38bdf8"/>
  <text x="172" y="460" font-size="11" font-weight="bold" text-anchor="middle" fill="#38bdf8">1 Bit = 8.68 us</text>

  <!-- Period & Frequency Measurement Callout matching Scope Screen -->
  <line x1="132" y1="300" x2="292" y2="300" stroke="#f43f5e" stroke-width="2"/>
  <polygon points="132,300 140,296 140,304" fill="#f43f5e"/>
  <polygon points="292,300 284,296 284,304" fill="#f43f5e"/>
  <text x="212" y="292" font-size="12" font-weight="bold" text-anchor="middle" fill="#f43f5e">Period = 17.36 us (2 Bits)</text>

  <!-- Analysis Box at Bottom -->
  <rect x="40" y="495" width="920" height="165" rx="6" fill="#1e293b" stroke="#334155"/>
  
  <text x="60" y="525" font-size="15" font-weight="bold" fill="#38bdf8">Character Observed and UART Decoding Details:</text>
  
  <text x="60" y="550" font-size="13" fill="#e2e8f0">&#8226; UART Frame Format: 8-N-1 (1 Start Bit, 8 Data Bits LSB first, No Parity, 1 Stop Bit) @ 115200 Baud.</text>
  <text x="60" y="575" font-size="13" fill="#e2e8f0">&#8226; Measured Bit Period: T_bit = 17.36 us / 2 = 8.68 us -> Baud Rate = 1 / 8.68 us = 115,207 Baud (~115.2k).</text>
  <text x="60" y="600" font-size="13" fill="#e2e8f0">&#8226; Decoded Bit Sequence (LSB first): [D0=1, D1=0, D2=1, D3=0, D4=1, D5=0, D6=1, D7=0] -> MSB first: 01010101_2.</text>
  <text x="60" y="625" font-size="13" fill="#00ffcc">&#8226; Hexadecimal: 0x55 | Decimal: 85 | ASCII Character Observed: 'U'</text>
  <text x="60" y="650" font-size="13" fill="#a0b0cf">&#8226; Trigger: Falling edge triggered at 1.60V; inter-character transmission repeat period is 100 ms.</text>
</svg>
