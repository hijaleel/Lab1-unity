; PlatformIO Project Configuration File for Bare-Metal C FreeRTOS Project
; Device: Arduino MKR Zero (ATSAMD21G18A ARM Cortex-M0+)
; Course: ECNG3006

[env:mkrzero]
platform = atmelsam
board = mkrzero
framework = arduino

lib_ldf_mode = deep+

build_flags = 
    -Wall
    -D __SAMD21G18A__
    -w

lib_deps =
    briscoetech/FreeRTOS_SAMD21 @ ^2.3.0

test_build_src = yes
test_framework = unity

monitor_speed = 115200
