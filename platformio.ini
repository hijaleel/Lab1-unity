; PlatformIO Project Configuration File for Bare-Metal C FreeRTOS Project
; Device: Arduino MKR Zero (ATSAMD21G18A ARM Cortex-M0+)
; Author: Mark R. Jennings
; Date: October 1, 2026
; Course: ECNG3006

[env:mkrzero]
platform = atmelsam
board = mkrzero
framework = arduino

lib_ldf_mode = deep+

build_flags = 
    -Wall                 ; Turn on all compiler warnings for safety
    -D __SAMD21G18A__     ; Identify exact core map to sam.h
    -w

lib_deps =
    briscoetech/FreeRTOS_SAMD21 @ ^2.3.0

build_src_filter = +<calc.c> -<main.cpp>
test_build_src = yes
test_framework = unity

monitor_speed = 115200



